<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Jelly Settings</title>
    <style>
      /*
       * A settings window that reads as part of the Mac: sidebar of sections on
       * the left over the window's own vibrancy, grouped rows on the right the
       * way System Settings draws them. Colours follow light and dark.
       */
      :root {
        color-scheme: light dark;
        --text: #1d1d1f;
        --text-2: #6e6e73;
        --pane: #f5f5f7;
        --group: #ffffff;
        --line: rgba(0, 0, 0, 0.08);
        --select: rgba(0, 0, 0, 0.07);
        --accent: #f53d3d;
        --track: rgba(0, 0, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f5f5f7;
          --text-2: #98989d;
          --pane: #1e1e1e;
          --group: #2a2a2a;
          --line: rgba(255, 255, 255, 0.08);
          --select: rgba(255, 255, 255, 0.1);
          --track: rgba(255, 255, 255, 0.18);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        color: var(--text);
        background: transparent;
        display: flex;
        -webkit-user-select: none;
        user-select: none;
        overflow: hidden;
      }
      nav {
        width: 190px;
        flex: none;
        padding: 52px 10px 12px;
        -webkit-app-region: drag;
      }
      nav button {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: default;
      }
      nav button[aria-current='true'] { background: var(--select); }
      nav .dot {
        width: 20px; height: 20px; border-radius: 5px;
        background: var(--accent);
        display: grid; place-items: center;
        color: white; font-size: 11px; font-weight: 600;
      }
      main {
        flex: 1;
        background: var(--pane);
        overflow-y: auto;
        padding: 0 24px 24px;
      }
      header {
        position: sticky; top: 0;
        height: 52px;
        display: flex; align-items: center;
        background: var(--pane);
        font-size: 15px; font-weight: 600;
        -webkit-app-region: drag;
        z-index: 1;
      }
      .group {
        background: var(--group);
        border-radius: 10px;
        border: 0.5px solid var(--line);
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 40px;
        padding: 6px 14px;
      }
      .row + .row { border-top: 0.5px solid var(--line); }
      .row label { flex: 1; }
      .note { color: var(--text-2); font-size: 11px; margin: -8px 4px 16px; }
      .value {
        width: 46px;
        text-align: right;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 190px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 0%) 100% no-repeat, var(--track);
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px; height: 18px; border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.2), 0 1px 3px rgba(0, 0, 0, 0.25);
      }
      .switch {
        position: relative;
        width: 38px; height: 22px;
        border-radius: 11px;
        background: var(--track);
        border: 0;
        transition: background 0.15s;
      }
      .switch::after {
        content: '';
        position: absolute; top: 2px; left: 2px;
        width: 18px; height: 18px; border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s;
      }
      .switch[aria-checked='true'] { background: var(--accent); }
      .switch[aria-checked='true']::after { transform: translateX(16px); }
      select {
        font: inherit;
        color: inherit;
        background: var(--select);
        border: 0;
        border-radius: 6px;
        padding: 3px 8px;
      }
      input[type='color'] {
        width: 44px; height: 22px;
        border: 0; padding: 0; background: none;
      }
      input[type='color']::-webkit-color-swatch-wrapper { padding: 0; }
      input[type='color']::-webkit-color-swatch { border: 0.5px solid var(--line); border-radius: 5px; }
      main { display: flex; flex-direction: column; }
      #pane { flex: 1; }
      footer {
        position: sticky; bottom: 0;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 12px 0 0; margin-top: 8px;
        background: var(--pane);
        border-top: 0.5px solid var(--line);
      }
      #saved { color: var(--text-2); font-size: 12px; }
      button.primary {
        font: inherit; font-weight: 500; color: #fff;
        background: var(--accent); border: 0; border-radius: 6px;
        padding: 5px 14px;
      }
      button.primary:active { filter: brightness(0.92); }
      .actions { display: flex; justify-content: flex-end; }
      .actions button {
        font: inherit; color: inherit;
        background: var(--group);
        border: 0.5px solid var(--line);
        border-radius: 6px;
        padding: 4px 12px;
      }
      input.key {
        width: 230px;
        font: inherit; color: inherit;
        background: var(--select);
        border: 0; border-radius: 6px;
        padding: 4px 8px;
        -webkit-user-select: text; user-select: text;
      }
      button.small {
        font: inherit; color: inherit;
        background: var(--select);
        border: 0; border-radius: 6px;
        padding: 3px 10px;
      }
      .status { color: var(--text-2); }
      .note a { color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <nav id="nav" aria-label="Sections"></nav>
    <main>
      <header id="title"></header>
      <div id="pane"></div>
      <footer>
        <span id="saved" role="status" aria-live="polite">Changes save automatically</span>
        <button id="save" class="primary">Save Settings</button>
      </footer>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
